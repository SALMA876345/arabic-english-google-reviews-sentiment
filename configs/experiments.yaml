# Phase 3 experiment matrix. Originally written as PREPARED/NOT_RUN before any
# training; statuses below were updated after Phase 3A (laptop/LoRA) actually
# ran -- see paper/notes/phase3_report.md for Phase 3A results and
# paper/notes/phase3b_report.md for the separate Phase 3B (Kaggle GPU full
# fine-tuning) track appended at the bottom of this file.
# See docs/experimental_dataset_protocol.md for dataset/split definitions
# and docs/methodology_plan.md for model/metric rationale.

seed: 42

primary_experiments:
  E1:
    name: Arabic-only sentiment classification
    data: arabic_tourism_primary
    splits: {train: arabic_tourism_train_ids, val: arabic_tourism_val_ids, test: arabic_tourism_test_ids}
    models: [tfidf_logreg, tfidf_svm, marbert, xlm_r]
    status: RAN_PHASE3A_COMPLETED
    note: >
      AraBERT was in the original plan but not run (compute constraint,
      MARBERT preferred per methodology_plan.md S7 -- see configs/models.yaml).
      Best validation-selected model: TF-IDF+LogReg (val F1=0.7492). Results:
      paper/notes/phase3_report.md. Also re-run as Phase 3B full-FT on GPU --
      see phase3b_experiments below.

  E2:
    name: English-only sentiment classification
    data: english_matched_primary
    splits: {train: english_matched_train_ids, val: english_matched_val_ids, test: english_matched_test_ids}
    models: [tfidf_logreg, tfidf_svm, xlm_r]
    status: RAN_PHASE3A_COMPLETED
    note: "Best validation-selected model: TF-IDF+LogReg (val F1=0.6770). Also re-run as Phase 3B full-FT on GPU."

  E3:
    name: Matched Arabic-vs-English comparison
    data: [arabic_tourism_primary, english_matched_primary]
    note: >
      The primary cross-language comparison. Report stratified by dataset
      origin per dataset_audit.md S7; treat as exploratory/confounded until
      the matched-protocol validation slice (annotation_guidelines.md) is
      annotated, per label_provenance_policy.md. This is a reporting/
      comparison exercise over E1+E2 results, not a separate training run.
    models: [tfidf_logreg, tfidf_svm, marbert, xlm_r]
    status: RAN_PHASE3A_COMPLETED
    note_2: "Phase 3A: classical numerically higher but NOT significant after Holm-Bonferroni correction (adjusted p>=0.09). See phase3_report.md Q9."

  E4:
    name: Combined multilingual training
    data: [arabic_tourism_primary, english_matched_primary, jordan_auxiliary_weak_train]
    note: >
      Jordan contributes training rows only (llm_weak_label, binary) --
      never evaluation. Evaluate on arabic_tourism_test + english_matched_test only.
    models: [xlm_r, marbert]
    status: NOT_RUN_ON_LAPTOP_COMPUTE_MEMORY_CONSTRAINT / RAN_ON_PHASE3B_GPU
    outcome: >
      Phase 3A (laptop, LoRA): 3 consecutive OOM failures across decreasing batch
      sizes (4, 4, 2), the last failing on a ~1.5MB allocation on an 8.3GB-RAM
      machine -- indicates volatile memory pressure from other processes on this
      shared machine, not a fixable batch-size issue. See docs/decisions.md D15.
      Phase 3B (Kaggle GPU, full FT): COMPLETED as "XLM-R Multilingual" --
      Arabic test macro-F1=0.767865, English test macro-F1=0.739722. This IS
      the primary research E4 result. See phase3b_experiments.E4_gpu below and
      paper/notes/phase3b_report.md.

  E5:
    name: Cross-lingual / multilingual robustness
    data: [arabic_tourism_primary, english_matched_primary]
    note: Train on one language, zero-shot evaluate on the other; and vice versa.
    models: [xlm_r]
    status: RAN_PHASE3A_COMPLETED
    note_2: >
      Phase 3A (LoRA, inference-only reuse of E1/E2 adapters): ArTrain->EnTest
      macro-F1=0.5455, EnTrain->ArTest macro-F1=0.5411, both below in-language
      scores. Also re-run as Phase 3B full-FT zero-shot (E5A/E5B) on GPU --
      see phase3b_experiments below.

supplementary_experiments:
  E6:
    name: Real-world code-switch evaluation
    data: codeswitch_diagnostic_verified
    status: NOT_FEASIBLE_QUANTITATIVELY
    note: >
      Only 9 verified genuine code-switched reviews exist (codeswitch_audit.md).
      Too few for a train/test split or any statistical comparison. Retained
      only as a qualitative illustration set for RQ4 error analysis, not as
      a runnable experiment. Re-evaluate if dedicated new data collection
      (outside this sprint's scope) is undertaken later.

  E7:
    name: External SESA-CSD evaluation
    data: SESA-CSD (Alghamdi et al. 2026, AbjadNLP)
    status: BLOCKED_NO_CONFIRMED_ACCESS
    note: >
      No confirmed public download path found during Phase 1/2 audits
      (research_raw/codeswitch_datasets_raw.md). Revisit only if the authors
      can be contacted and grant access within remaining project time.

  E8:
    name: Full-English scale experiment
    data: english_full_scale_pool_E8
    n: 1035118
    note: >
      MUST exclude the 3,525 review_ids already committed to english_matched_primary
      (data/splits/frozen_v1/english_e8_scale_pool_exclusion_rule.json) to avoid
      leaking the matched comparison's test set into this experiment's training data.
      Labels are rating_derived only -- report with the same caveat as E2/E3.
    models: [tfidf_logreg, xlm_r]
    status: PREPARED_NOT_RUN

  E_jordan_binary_aux:
    name: Jordan binary auxiliary experiment
    data: jordan_auxiliary
    train: jordan_auxiliary_weak_train (llm_weak_label, 8364 rows)
    eval: jordan_auxiliary_eval_gold (human_annotated, 300 rows, binary Positive/Negative only)
    note: Report separately from all 3-class results -- different task (binary, no Neutral).
    models: [tfidf_logreg, marbert]
    status: RAN_PHASE3A_COMPLETED
    note_2: "tfidf_logreg only (MARBERT variant not attempted, same compute constraint). Binary macro-F1=0.9233 (observed-classes-only; see model_comparison.md caution column)."

# =============================================================================
# PHASE 3B -- Kaggle GPU full fine-tuning experiments (separate track, see
# docs/decisions.md D17, configs/training.yaml's phase3b_gpu section, and
# paper/notes/phase3b_report.md). Results received from external Kaggle runs,
# integrated and audited here, not executed in this repository's own session.
# =============================================================================
phase3b_experiments:
  E1_gpu:
    name: Arabic-only, full fine-tuning on GPU
    models: [marbert_fullft, xlmr_fullft]
    status: RAN_COMPLETED
    results: "MARBERT 0.785025 (primary) / 0.765263 (repro rerun); XLM-R 0.740295 (primary) / 0.740126 (repro rerun)"
    data_integrity: "input bundle hash-verified identical to data/processed/frozen_v1 + data/splits/frozen_v1"

  E2_gpu:
    name: English-only, full fine-tuning on GPU
    models: [xlmr_fullft]
    status: RAN_COMPLETED
    results: "XLM-R 0.727644"

  E4_gpu:
    name: Combined multilingual training, full fine-tuning on GPU
    models: [xlmr_multilingual]
    status: RAN_COMPLETED
    results: "Arabic 0.767865, English 0.739722 -- THIS IS the primary research E4 result (laptop E4 did not complete, see E4 above)"

  E5_gpu:
    name: Cross-lingual zero-shot, full fine-tuning on GPU
    models: [xlmr_fullft]
    status: RAN_COMPLETED
    results: "E5A (Arabic-trained -> English test) 0.680415; E5B (English-trained -> Arabic test) 0.679992"

  statistical_testing:
    method: paired bootstrap, 10000 samples, seed=42, Holm-Bonferroni correction
    status: RAN_COMPLETED
    files: [results/phase3b_kaggle_gpu/arabic_paired_bootstrap_holm_results.csv, results/phase3b_kaggle_gpu/english_paired_bootstrap_holm_results.csv]
    headline_finding: >
      Only in-language/multilingual-vs-zero-shot comparisons survive Holm
      correction. No significant difference found among the strong standalone/
      multilingual models themselves (MARBERT vs XLM-R, standalone vs
      multilingual) at these sample sizes.

  deployment_model:
    name: Separate GPU training pass for serving (NOT a research artifact)
    location: backend/model/
    status: INTEGRATED_INTO_BACKEND
    validation_macro_f1: 0.7999539459285145
    note: "Must not be cited as the E4_gpu research result -- see known_limitations.md #24"

metrics:
  primary: macro_f1
  also_report: [weighted_f1, per_class_f1, per_language_f1, precision, recall, accuracy, confusion_matrix]
  statistical: [bootstrap_confidence_intervals, paired_bootstrap_or_mcnemar_for_model_comparisons]
  rules:
    - no_hyperparameter_tuning_on_test_set
    - no_test_set_inspection_before_split_freeze_is_final
    - never_rebalance_validation_or_test_data
    - class_weighting_and_oversampling_if_used_must_be_train_only_and_documented_as_separate_experimental_choice
